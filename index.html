<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS v2 (CDN) — must load before script.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- GitHub link (top-left) -->
  <a id="github-link" href="https://github.com/iagoesteevezz" target="_blank" rel="noopener noreferrer">
    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </svg>
    iagoesteevezz
  </a>

  <!-- Auth bar (top-right) -->
  <div id="auth-bar">
    <span id="sync-indicator">✓ synced</span>
    <span id="auth-user" style="display:none"></span>
    <button id="btn-login"  onclick="openAuthModal()" title="Save progress to the cloud">Sign in</button>
    <button id="btn-logout" onclick="logout()" style="display:none">Sign out</button>
  </div>

  <!-- Auth modal -->
  <div id="auth-overlay">
    <div id="auth-modal">
      <button id="auth-close" onclick="closeAuthModal()" title="Close">✕</button>
      <h2>Save Progress</h2>
      <div id="auth-tabs">
        <button class="auth-tab active" onclick="setTab('signin')">Sign In</button>
        <button class="auth-tab"        onclick="setTab('signup')">Create Account</button>
      </div>
      <input  id="auth-email"    type="email"    placeholder="Email"    autocomplete="email" />
      <input  id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="auth-submit"   onclick="submitAuth()">Sign In</button>
      <div    id="auth-error"></div>
    </div>
  </div>

  <!-- Game UI -->
  <div id="level-label">Level <span id="level-num">1</span></div>
  <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="message">Click an arrow to fire it</div>
  <div id="status-row">
    <div id="counter"></div>
    <div id="hearts"></div>
  </div>
  <div id="btn-row">
    <button onclick="restartLevel()">Restart</button>
    <button id="btn-next"  onclick="nextLevel()">Next Level →</button>
    <button id="btn-retry" onclick="restartLevel()">Try Again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
